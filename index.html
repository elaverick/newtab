<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>New Tab</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=Special+Elite&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="style/main.css"
    >

</head>


<body>


<div class="page">


    <!-- ============================================================
         TOP BAR
         ============================================================ -->

    <header class="topbar">

        <div class="topbar-left">

            <div class="logo">
                N/01
            </div>

            <div class="location">
                PERSONAL INDEX
            </div>

        </div>


        <div class="topbar-right">

            <span id="clock">
                14:23
            </span>

            <span
                class="weather"
                id="weather"
                title="Local weather"
                aria-label="Local weather"
                hidden
            >
                •
            </span>

            <span id="date">
                19.09.26
            </span>

            <button
                class="theme-toggle"
                id="themeToggle"
                type="button"
                aria-label="Toggle light and dark mode"
                title="Toggle light and dark mode"
            >
                ◐
            </button>

        </div>

    </header>



    <!-- ============================================================
         SEARCH
         ============================================================ -->

    <section class="hero">

        <div class="hero-kicker">
            01 / SEARCH
        </div>

        <h1 class="hero-title">
            Search
        </h1>


        <form
            class="search"
            id="searchForm"
        >


            <div class="provider-wrapper">


                <button
                    class="search-provider"
                    id="providerButton"
                    type="button"
                    aria-haspopup="true"
                    aria-expanded="false"
                >

                    <span
                        class="search-provider-mark"
                        id="providerMark"
                    >
                        G
                    </span>

                    <span
                        class="provider-name"
                        id="providerName"
                    >
                        Google
                    </span>

                    <span class="search-provider-arrow">
                        ↓
                    </span>

                </button>


                <div
                    class="provider-menu"
                    id="providerMenu"
                >

                    <button
                        class="provider-option active"
                        data-provider="Google"
                        data-mark="G"
                        type="button"
                    >
                        Google
                    </button>

                    <button
                        class="provider-option"
                        data-provider="Bing"
                        data-mark="B"
                        type="button"
                    >
                        Bing
                    </button>

                    <button
                        class="provider-option"
                        data-provider="DuckDuckGo"
                        data-mark="D"
                        type="button"
                    >
                        DuckDuckGo
                    </button>

                    <button
                        class="provider-option"
                        data-provider="Brave"
                        data-mark="B"
                        type="button"
                    >
                        Brave
                    </button>

                </div>

            </div>


            <input
                id="searchInput"
                type="search"
                placeholder="Search the web..."
                autocomplete="off"
                aria-label="Search the web"
            >


            <button
                class="search-submit"
                type="submit"
                aria-label="Search"
            >
                →
            </button>


        </form>

    </section>



    <!-- ============================================================
         FREQUENT SITES
         ============================================================ -->

    <section class="section">


        <div class="section-header">


            <div class="section-heading">

                <span class="section-number">
                    02
                </span>

                <h2 class="section-title">
                    Places
                </h2>

                <p class="section-description">
                    Frequently visited
                </p>

            </div>


            <button
                class="section-action"
                id="placesEdit"
                type="button"
                aria-label="Choose sites"
                title="Choose sites"
            >
                +
            </button>


        </div>


        <div
            class="site-grid"
            id="siteGrid"
        ></div>


        <div
            class="places-modal"
            id="placesModal"
            hidden
        >

            <div
                class="places-modal-backdrop"
                data-places-close
            ></div>

            <div
                class="places-dialog"
                role="dialog"
                aria-modal="true"
                aria-labelledby="placesDialogTitle"
            >

                <div class="places-dialog-header">

                    <div>

                        <span class="places-dialog-kicker">
                            02 / PLACES
                        </span>

                        <h3
                            class="places-dialog-title"
                            id="placesDialogTitle"
                        >
                            Choose sites
                        </h3>

                    </div>

                    <button
                        class="places-dialog-close"
                        id="placesClose"
                        type="button"
                        aria-label="Close"
                    >
                        ×
                    </button>

                </div>

                <p class="places-dialog-description">
                    Select the sites you want to show on the page.
                </p>

                <div
                    class="places-options"
                    id="placesOptions"
                ></div>

                <div class="places-add">

                    <div class="places-add-heading">
                        Add a site
                    </div>

                    <div class="places-add-fields">

                        <input
                            id="newSiteName"
                            type="text"
                            placeholder="Name"
                            autocomplete="off"
                        >

                        <input
                            id="newSiteUrl"
                            type="url"
                            placeholder="https://example.com"
                            autocomplete="off"
                        >

                        <button
                            class="places-add-button"
                            id="addSiteButton"
                            type="button"
                        >
                            +
                        </button>

                    </div>

                </div>

                <div class="places-dialog-footer">

                    <button
                        class="places-dialog-button"
                        id="placesCancel"
                        type="button"
                    >
                        Cancel
                    </button>

                    <button
                        class="places-dialog-button primary"
                        id="placesSave"
                        type="button"
                    >
                        Save
                    </button>

                </div>

            </div>

        </div>



    <!-- ============================================================
         NEWS
         ============================================================ -->

    <section class="section">


        <div class="section-header">


            <div class="section-heading">

                <span class="section-number">
                    03
                </span>

                <h2 class="section-title">
                    Elsewhere
                </h2>

                <p class="section-description">
                    Things worth noticing
                </p>

            </div>


            <button
                class="section-action"
                type="button"
                aria-label="Refresh articles"
            >
                ↻
            </button>


        </div>


        <div
            class="article-grid"
            id="articleGrid"
        ></div>


        <template id="articleTemplate">

            <article class="article">

                <a
                    class="article-link"
                    href=""
                    target="_blank"
                    rel="noopener noreferrer"
                >

                    <div class="article-image">

                        <img
                            class="article-image-content"
                            src=""
                            alt=""
                            loading="lazy"
                        >

                        <span class="article-image-placeholder">
                            IMAGE
                        </span>

                    </div>

                    <div class="article-meta">

                        <span>
                            STORY
                        </span>

                        <span class="article-number">
                        </span>

                    </div>

                    <div class="article-content">

                        <h3 class="article-title">
                        </h3>

                        <p class="article-description">
                        </p>

                        <div class="article-footer">

                            <span>
                                SOURCE
                            </span>

                        </div>

                    </div>

                </a>

            </article>

        </template>


        <div
            class="article-sentinel"
            id="articleSentinel"
            aria-hidden="true"
        ></div>

    </section>



    <!-- ============================================================
         FOOTER
         ============================================================ -->

    <div class="divider">
        END OF INDEX
    </div>


    <footer class="footer">

        <span>
            PERSONAL NEW TAB
        </span>

        <span>
            N/01
        </span>

    </footer>


</div>


<script src="js/script.js"></script>

</body>

</html>
